{% include password-gate.html %}


	<script type="text/javascript" src="/assets/javascripts/jquery-3.5.1.min.js"></script>

	<script type="text/javascript">
	"use strict";

	// Set your password here - change "checkout" to your desired password
	var CORRECT_PASSWORD = "cong-protected";
	var REDIRECT_URL = "https://www.figma.com/deck/nUP4q8wSg9E6p8rTdChoQb/Cart---Checkout-Redesign?node-id=1-943&viewport=-103%2C-33%2C0.5&t=XJdYTz9g3Uoc32aB-1&scaling=min-zoom&content-scaling=fixed&page-id=0%3A1";

	function checkPassword(pwd) {
		if (pwd === CORRECT_PASSWORD) {
			window.location.href = REDIRECT_URL;
		} else {
			$("#password").val("");
			$("#wrongPassword").prop("hidden", false);
		}
	}

	$("#loginbutton").on("click", function() {
		checkPassword($("#password").val());
	});
	$("#password").keypress(function(e) {
		if (e.which === 13) {
			checkPassword($("#password").val());
		}
	});
	$("#password").on("input", function() {
		$("#wrongPassword").prop("hidden", true);
	});

	</script>
