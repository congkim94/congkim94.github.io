<script>
	// Holds the hero in its pre-landing state before first paint. The timer
	// lets everything show if the flip script never runs. A return from a
	// project skips this and shows the finished page.
	(function () {
		var skip = false;
		try {
			var nav = performance.getEntriesByType("navigation")[0];
			if (nav && nav.type === "back_forward") skip = true;
			if (sessionStorage.getItem("oval-return") === "1") skip = true;
			sessionStorage.removeItem("oval-return");
			if (document.referrer) {
				var from = new URL(document.referrer);
				var path = from.pathname.replace(/\/+$/, "") || "/";
				var home = path === "/" || path === "/index.html" || path === "/oval.html";
				if (from.origin === location.origin && !home) skip = true;
			}
		} catch (e) {}

		window.addEventListener("pageshow", function (event) {
			if (!event.persisted) return;
			document.documentElement.classList.remove("oval-landing");
			clearTimeout(window.ovalLandingFallback);
		});

		if (skip || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

		document.documentElement.classList.add("oval-landing");
		window.ovalLandingFallback = setTimeout(function () {
			document.documentElement.classList.remove("oval-landing");
		}, 8200);
	})();
</script>
