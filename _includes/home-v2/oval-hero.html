<script>
	// Holds the hero in its pre-landing state before first paint. The timer
	// lets everything show if the flip script never runs.
	if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
		document.documentElement.classList.add("oval-landing");
		window.ovalLandingFallback = setTimeout(function () {
			document.documentElement.classList.remove("oval-landing");
		}, 4000);
	}
</script>
<section class="hero-v2 hero-oval" aria-labelledby="hero-v2-headline">

			<div class="hero-oval__disc">
				<canvas id="hero-v2-shader" class="hero-v2__shader hero-oval__shader" aria-hidden="true"></canvas>
			</div>
		</div>

		<h1 id="hero-v2-headline" class="hero-oval__name">Cong Kim</h1>
		<p class="hero-oval__tagline">A product designer building intuitive and thoughtful digital experiences for everyone.</p>
	</div>
</section>
