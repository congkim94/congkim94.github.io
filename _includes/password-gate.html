<script>
	// Same glow reveal as the homepage: it scales up and fades in. A return
	// from the back button skips it and shows the finished oval.
	(function () {
		var skip = false;
		try {
			var nav = performance.getEntriesByType("navigation")[0];
			if (nav && nav.type === "back_forward") skip = true;
		} catch (e) {}

		window.addEventListener("pageshow", function (event) {
			if (!event.persisted) return;
			document.documentElement.classList.remove("gate-reveal");
		});

		if (skip || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

		document.documentElement.classList.add("gate-reveal");
	})();
</script>
<section class="gate-page">
	<div class="gate-page__oval" aria-hidden="true">
		<div class="gate-page__disc">
			<div class="gate-page__spin">
				<img
					class="gate-page__fallback"
					src="/assets/images/password/oval.png"
					alt=""
					width="622"
					height="829"
				>
			</div>
			<div class="gate-page__shader-frame">
				<canvas id="gate-oval-shader" class="gate-page__shader"></canvas>
			</div>
		</div>
	</div>

	<div class="gate-page__panel">
		<p class="gate-page__copy">
			<span class="gate-page__line">This case study is password-protected.</span>
			<span class="gate-page__line">Please contact me at <a href="mailto:congkim94@gmail.com">congkim94@gmail.com</a> for details.</span>
		</p>
		<div class="gate">
			<input id="password" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" />
			<button id="loginbutton" class="gate__submit" type="button" aria-label="Enter">
				<img src="/assets/images/password/arrow.svg" alt="" width="24" height="24">
			</button>
		</div>
		<p id="wrongPassword" class="gate__error" role="alert" hidden>wrong password</p>
	</div>
</section>
