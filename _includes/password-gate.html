<script>
	// Lock the page to the visible height before the first paint. On a phone
	// the small viewport settles a moment later, and a centered block slides
	// up with it. A desktop resize and a rotation still update. The mobile
	// toolbar does not. The keyboard follows, and blur waits until it rests.
	(function () {
		var lastWidth = window.innerWidth;
		var closing = false;
		var settleTimer = 0;
		var finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");

		function lockGateHeight() {
			var viewport = window.visualViewport;
			var height = viewport ? viewport.height : window.innerHeight;
			document.documentElement.style.setProperty("--gate-h", height + "px");
		}

		function settle() {
			window.clearTimeout(settleTimer);
			settleTimer = window.setTimeout(function () {
				closing = false;
				lockGateHeight();
			}, 160);
		}

		lockGateHeight();

		window.addEventListener("resize", function () {
			var widthChanged = window.innerWidth !== lastWidth;
			lastWidth = window.innerWidth;
			if (finePointer.matches || widthChanged) lockGateHeight();
		});

		window.addEventListener("orientationchange", function () {
			window.setTimeout(lockGateHeight, 50);
		});

		window.addEventListener("DOMContentLoaded", function () {
			var field = document.getElementById("password");
			if (!field || !window.visualViewport) return;

			window.visualViewport.addEventListener("resize", function () {
				if (document.activeElement === field) {
					closing = false;
					window.clearTimeout(settleTimer);
					lockGateHeight();
					return;
				}
				if (closing) settle();
			});

			field.addEventListener("blur", function () {
				closing = true;
				settle();
			});
		});
	})();
</script>
<script>
	// Same glow reveal as the homepage: it scales up and fades in. A return
	// from the back button skips it and shows the finished oval.
	(function () {
		var skip = false;
		try {
			var nav = performance.getEntriesByType("navigation")[0];
			if (nav && nav.type === "back_forward") skip = true;
		} catch (e) {}

		window.addEventListener("pageshow", function (event) {
			if (!event.persisted) return;
			document.documentElement.classList.remove("gate-reveal");
		});

		if (skip || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

		document.documentElement.classList.add("gate-reveal");
	})();
</script>
